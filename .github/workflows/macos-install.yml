name: macos-install
on: [push, workflow_dispatch]
jobs:
  install-fleet:
    runs-on: macos-latest
    steps:
      - name: Probe stock toolchain
        run: |
          sw_vers
          which node && node -v
          which npm && npm -v

      - name: Install Paseo CLI (beta)
        run: npm install -g @getpaseo/cli@beta

      - name: Start ephemeral daemon
        run: |
          export PASEO_HOME="$(mktemp -d)/paseo-home"
          echo "PASEO_HOME=$PASEO_HOME" >> "$GITHUB_ENV"
          paseo daemon start
          paseo status

      - name: Install fleet (sequential, one runner)
        run: |
          for spec in \
            "xpufx/paseo-plugin-helper:demo-v8 --ref v8" \
            "xpufx/paseo-top --ref v0.8" \
            "xpufx/paseo-mcp-tools --ref v0.8" \
            "xpufx/paseo-x-comms --ref v0.8" \
          ; do
            # shellcheck disable=SC2086
            paseo plugin add $spec
          done

      - name: Enable fleet
        run: |
          paseo plugin enable helper-demo-v8
          paseo plugin enable top
          paseo plugin enable mcp-tools
          paseo plugin enable x-comms

      - name: List fleet
        run: |
          paseo plugin ls
          paseo plugin logs helper-demo-v8 | tail -10
          paseo plugin logs top | tail -10
          paseo plugin logs mcp-tools | tail -10
          paseo plugin logs x-comms | tail -10

      - name: Remove fleet
        if: always()
        run: |
          paseo plugin remove helper-demo-v8 || true
          paseo plugin remove top || true
          paseo plugin remove mcp-tools || true
          paseo plugin remove x-comms || true
